<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>日運星盤｜Jerry</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c9a84c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="日運星盤">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="72x72" href="icons/icon-72.png">
<link rel="apple-touch-icon" sizes="96x96" href="icons/icon-96.png">
<link rel="apple-touch-icon" sizes="128x128" href="icons/icon-128.png">
<link rel="apple-touch-icon" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="512x512" href="icons/icon-512.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">

<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #c9a84c;
  --gold-light: #e8c97a;
  --gold-dim: #7a6030;
  --gold-glow: #c9a84c22;
  --ink: #0a0806;
  --ink-2: #120e08;
  --ink-3: #1a1408;
  --paper: #f0e8d0;
  --red: #8b2020;
  --red-light: #c96060;
  --green: #1a4a2a;
  --green-light: #5a9a6a;
  --blue: #1a2a4a;
  --blue-light: #5a80b0;
  --border: #c9a84c28;
  --border-bright: #c9a84c66;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html { scroll-behavior: smooth; }

body {
  background: var(--ink);
  color: var(--gold-light);
  font-family: 'Noto Serif TC', serif;
  min-height: 100vh;
  min-height: -webkit-fill-available;
  overflow-x: hidden;
  cursor: default;
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

/* ── BACKGROUND ── */
.bg-layer {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
}

.bg-layer::before {
  content: '';
  position: absolute;
  inset: 0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, #1a100a18 0%, transparent 70%),
    radial-gradient(ellipse 60% 40% at 0% 100%, #0a0a1a18 0%, transparent 60%),
    radial-gradient(ellipse 40% 60% at 100% 50%, #1a0a0a10 0%, transparent 60%);
}

.bg-stars {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

.star-dot {
  position: absolute;
  border-radius: 50%;
  background: var(--gold);
  opacity: 0;
  animation: twinkle var(--dur) var(--delay) infinite;
}

@keyframes twinkle {
  0%, 100% { opacity: 0; transform: scale(0.5); }
  50% { opacity: var(--op); transform: scale(1); }
}

/* ── GRID LINES ── */
.grid-lines {
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 60px 60px;
  mask-image: radial-gradient(ellipse at center, black 20%, transparent 80%);
}

/* ── LAYOUT ── */
.wrap {
  position: relative;
  z-index: 1;
  max-width: 860px;
  margin: 0 auto;
  padding: 0 20px 80px;
}

/* ── HEADER ── */
.header {
  text-align: center;
  padding: 60px 0 40px;
  position: relative;
}

.header-ornament {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  margin-bottom: 20px;
  opacity: 0;
  animation: fadeUp 0.8s 0.2s forwards;
}

.header-ornament .line {
  height: 1px;
  width: 60px;
  background: linear-gradient(to right, transparent, var(--gold-dim));
}

.header-ornament .line.right {
  background: linear-gradient(to left, transparent, var(--gold-dim));
}

.header-ornament .diamond {
  width: 6px;
  height: 6px;
  border: 1px solid var(--gold-dim);
  transform: rotate(45deg);
}

.header h1 {
  font-family: 'Noto Serif TC', serif;
  font-weight: 900;
  font-size: clamp(36px, 8vw, 72px);
  color: var(--gold);
  text-shadow: 0 0 60px #c9a84c44, 0 0 120px #c9a84c22;
  line-height: 1;
  margin-bottom: 10px;
  opacity: 0;
  animation: fadeUp 0.8s 0.4s forwards;
}

.header .subtitle {
  font-family: 'Noto Serif TC', serif;
  font-weight: 300;
  font-size: 11px;
  letter-spacing: 6px;
  color: var(--gold-dim);
  opacity: 0;
  animation: fadeUp 0.8s 0.6s forwards;
}

@keyframes fadeUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── DATE SELECTOR ── */
.date-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  margin-bottom: 40px;
  opacity: 0;
  animation: fadeUp 0.8s 0.8s forwards;
}

.date-display {
  font-family: 'Noto Serif TC', serif;
  font-weight: 500;
  font-size: clamp(18px, 4vw, 28px);
  color: var(--gold);
  letter-spacing: 2px;
  text-align: center;
}

.date-nav {
  display: flex;
  align-items: center;
  gap: 12px;
}

.date-input {
  background: var(--ink-2);
  border: 1px solid var(--border-bright);
  color: var(--gold-light);
  font-family: 'Noto Serif TC', serif;
  font-size: 14px;
  padding: 10px 16px;
  letter-spacing: 1px;
  outline: none;
  transition: border-color 0.3s, box-shadow 0.3s;
  cursor: pointer;
}

.date-input:focus {
  border-color: var(--gold);
  box-shadow: 0 0 20px var(--gold-glow);
}

.date-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--gold-dim);
  font-size: 18px;
  width: 40px;
  height: 40px;
  cursor: pointer;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
}

.date-btn:hover {
  border-color: var(--gold);
  color: var(--gold);
  box-shadow: 0 0 10px var(--gold-glow);
}

.today-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--gold-dim);
  font-family: 'Noto Serif TC', serif;
  font-size: 11px;
  letter-spacing: 2px;
  padding: 6px 14px;
  cursor: pointer;
  transition: all 0.2s;
}

.today-btn:hover {
  border-color: var(--gold);
  color: var(--gold);
}

/* ── GANZHI BANNER ── */
.ganzhi-banner {
  display: flex;
  justify-content: center;
  gap: 2px;
  margin-bottom: 36px;
  flex-wrap: wrap;
}

.gz-pill {
  padding: 6px 16px;
  font-size: 12px;
  letter-spacing: 2px;
  border: 1px solid var(--border);
  color: var(--gold-dim);
  background: var(--ink-2);
  transition: all 0.3s;
}

.gz-pill.highlight {
  border-color: var(--gold-dim);
  color: var(--gold);
  background: var(--gold-glow);
}

/* ── OVERALL SCORE ── */
.overall-card {
  position: relative;
  border: 1px solid var(--border-bright);
  background: var(--ink-2);
  padding: 36px;
  margin-bottom: 24px;
  text-align: center;
  overflow: hidden;
}

.overall-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: radial-gradient(ellipse at center, var(--gold-glow) 0%, transparent 70%);
  pointer-events: none;
}

.overall-card .corner {
  position: absolute;
  width: 20px;
  height: 20px;
  border-color: var(--gold-dim);
  border-style: solid;
}

.overall-card .corner.tl { top: 8px; left: 8px; border-width: 1px 0 0 1px; }
.overall-card .corner.tr { top: 8px; right: 8px; border-width: 1px 1px 0 0; }
.overall-card .corner.bl { bottom: 8px; left: 8px; border-width: 0 0 1px 1px; }
.overall-card .corner.br { bottom: 8px; right: 8px; border-width: 0 1px 1px 0; }

.overall-label {
  font-size: 10px;
  letter-spacing: 4px;
  color: var(--gold-dim);
  margin-bottom: 16px;
}

.overall-day-char {
  font-family: 'Noto Serif TC', serif;
  font-weight: 900;
  font-size: clamp(60px, 15vw, 100px);
  color: var(--gold);
  line-height: 1;
  text-shadow: 0 0 40px #c9a84c55;
  margin-bottom: 8px;
}

.overall-summary {
  font-size: 14px;
  color: #b09060;
  letter-spacing: 1px;
  margin-bottom: 20px;
}

.star-rating {
  display: flex;
  justify-content: center;
  gap: 6px;
  margin-bottom: 16px;
}

.star-rating .s {
  width: 8px;
  height: 8px;
  border: 1px solid var(--gold-dim);
  transform: rotate(45deg);
  transition: all 0.3s;
}

.star-rating .s.on {
  background: var(--gold);
  border-color: var(--gold);
  box-shadow: 0 0 6px var(--gold);
}

.overall-tip {
  font-size: 13px;
  color: var(--gold-dim);
  line-height: 1.8;
  max-width: 500px;
  margin: 0 auto;
  font-style: italic;
}

/* ── SCORE GRID ── */
.score-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 2px;
  margin-bottom: 24px;
}

@media (min-width: 600px) {
  .score-grid { grid-template-columns: repeat(4, 1fr); }
}

.score-card {
  background: var(--ink-2);
  border: 1px solid var(--border);
  padding: 20px 16px;
  text-align: center;
  position: relative;
  overflow: hidden;
  transition: border-color 0.3s;
}

.score-card:hover { border-color: var(--gold-dim); }

.score-card .sc-icon {
  font-size: 22px;
  margin-bottom: 8px;
  display: block;
}

.score-card .sc-label {
  font-size: 10px;
  color: var(--gold-dim);
  letter-spacing: 2px;
  margin-bottom: 10px;
}

.score-card .sc-bar-wrap {
  height: 2px;
  background: var(--ink-3);
  margin-bottom: 6px;
  overflow: hidden;
}

.score-card .sc-bar {
  height: 100%;
  transition: width 1s ease;
}

.sc-bar.high { background: var(--green-light); }
.sc-bar.mid { background: var(--gold); }
.sc-bar.low { background: var(--red-light); }

.score-card .sc-val {
  font-family: 'Noto Serif TC', serif;
  font-weight: 700;
  font-size: 18px;
  color: var(--gold-light);
}

/* ── DETAIL CARDS ── */
.detail-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 2px;
  margin-bottom: 24px;
}

@media (min-width: 600px) {
  .detail-grid { grid-template-columns: 1fr 1fr; }
}

.detail-card {
  background: var(--ink-2);
  border: 1px solid var(--border);
  padding: 24px;
  transition: border-color 0.3s, background 0.3s;
}

.detail-card:hover {
  border-color: var(--gold-dim);
  background: var(--ink-3);
}

.detail-card .dc-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 14px;
  padding-bottom: 10px;
  border-bottom: 1px solid var(--border);
}

.detail-card .dc-icon { font-size: 18px; }

.detail-card .dc-title {
  font-size: 11px;
  color: var(--gold-dim);
  letter-spacing: 2px;
  flex: 1;
}

.detail-card .dc-score {
  font-family: 'Cinzel', serif;
  font-size: 13px;
  color: var(--gold);
}

.detail-card .dc-body {
  font-size: 13px;
  color: #a08860;
  line-height: 1.9;
}

.detail-card .dc-body strong { color: var(--gold-light); font-weight: 500; }
.detail-card .dc-body .good { color: var(--green-light); }
.detail-card .dc-body .warn { color: var(--red-light); }

.tag-row {
  display: flex;
  flex-wrap: wrap;
  gap: 5px;
  margin-top: 10px;
}

.tag {
  font-size: 10px;
  padding: 2px 8px;
  border: 1px solid var(--border);
  color: var(--gold-dim);
  letter-spacing: 1px;
}

.tag.g { border-color: #3a5020; color: var(--green-light); }
.tag.r { border-color: #5a2020; color: var(--red-light); }
.tag.b { border-color: #203050; color: var(--blue-light); }

/* ── DAILY TIP ── */
.daily-tip {
  border: 1px solid var(--border);
  background: var(--ink-2);
  padding: 24px 28px;
  position: relative;
  margin-bottom: 24px;
}

.daily-tip::before {
  content: '今日提示';
  position: absolute;
  top: -9px;
  left: 24px;
  background: var(--ink-2);
  padding: 0 8px;
  font-size: 10px;
  letter-spacing: 3px;
  color: var(--gold-dim);
}

.daily-tip p {
  font-size: 13px;
  color: #b09060;
  line-height: 1.9;
}

.daily-tip p strong { color: var(--gold-light); }

/* ── MINGPAN INFO ── */
.mingpan-strip {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 2px;
  margin-bottom: 40px;
}

@media (min-width: 600px) {
  .mingpan-strip { grid-template-columns: repeat(6, 1fr); }
}

.mp-item {
  background: var(--ink-2);
  border: 1px solid var(--border);
  padding: 12px 8px;
  text-align: center;
}

.mp-item .mp-label {
  font-size: 9px;
  color: #504030;
  letter-spacing: 1px;
  margin-bottom: 4px;
}

.mp-item .mp-val {
  font-family: 'Noto Serif TC', serif;
  font-weight: 700;
  font-size: 15px;
  color: var(--gold);
}

/* ── FOOTER ── */
.footer {
  text-align: center;
  padding: 40px 0 20px;
  border-top: 1px solid var(--border);
}

.footer-ornament {
  font-size: 12px;
  letter-spacing: 8px;
  color: var(--gold-dim);
  opacity: 0.4;
  margin-bottom: 12px;
}

.footer p {
  font-size: 11px;
  color: #403020;
  letter-spacing: 1px;
}

/* ── LOADING ── */
.loading {
  text-align: center;
  padding: 60px;
  font-family: 'Ma Shan Zheng', cursive;
  font-size: 24px;
  color: var(--gold-dim);
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0%, 100% { opacity: 0.4; }
  50% { opacity: 1; }
}

/* ── TRANSITIONS ── */
.fortune-content {
  animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* scrollbar */
::-webkit-scrollbar { width: 4px; }
::-webkit-scrollbar-track { background: var(--ink); }
::-webkit-scrollbar-thumb { background: var(--gold-dim); }

/* ── PWA 安裝列 ── */
.pwa-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 100;
  background: var(--ink-2);
  border-top: 1px solid var(--border-bright);
  padding: 12px 20px;
  padding-bottom: calc(12px + env(safe-area-inset-bottom));
  display: flex;
  align-items: center;
  gap: 12px;
  justify-content: space-between;
  transform: translateY(100%);
  transition: transform 0.4s ease;
}

.pwa-bar.show { transform: translateY(0); }

.pwa-bar .pwa-text {
  font-size: 12px;
  color: var(--gold-dim);
  letter-spacing: 1px;
  flex: 1;
}

.pwa-bar .pwa-text strong { color: var(--gold); }

.pwa-install-btn {
  background: transparent;
  border: 1px solid var(--gold);
  color: var(--gold);
  font-family: 'Noto Serif TC', serif;
  font-size: 12px;
  letter-spacing: 2px;
  padding: 8px 18px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}

.pwa-install-btn:hover { background: var(--gold-glow); }

.pwa-dismiss-btn {
  background: transparent;
  border: none;
  color: var(--gold-dim);
  font-size: 18px;
  cursor: pointer;
  padding: 4px;
  line-height: 1;
}

/* 通知按鈕 */
.notify-btn {
  display: flex;
  align-items: center;
  gap: 8px;
  background: transparent;
  border: 1px solid var(--border);
  color: var(--gold-dim);
  font-family: 'Noto Serif TC', serif;
  font-size: 11px;
  letter-spacing: 1px;
  padding: 6px 14px;
  cursor: pointer;
  transition: all 0.2s;
  margin: 0 auto 20px;
}

.notify-btn:hover { border-color: var(--gold); color: var(--gold); }
.notify-btn.enabled { border-color: var(--green-light); color: var(--green-light); }
</style>
</head>
<body>

<!-- Background -->
<div class="bg-layer">
  <div class="bg-stars" id="bgStars"></div>
  <div class="grid-lines"></div>
</div>

<div class="wrap">

  <!-- Header -->
  <div class="header">
    <div class="header-ornament">
      <div class="line"></div>
      <div class="diamond"></div>
      <div class="line right"></div>
    </div>
    <h1>日運星盤</h1>
    <div class="subtitle">DAILY FORTUNE · ZIWEI DOUSHU · JERRY</div>
  </div>

  <!-- Notify Button -->
  <div style="text-align:center; margin-bottom: 8px; opacity:0; animation: fadeUp 0.8s 1s forwards;">
    <button class="notify-btn" id="notifyBtn" onclick="requestNotify()">
      <span id="notifyIcon">🔔</span>
      <span id="notifyLabel">開啟每日推送提醒</span>
    </button>
  </div>

  <!-- Date Selector -->
  <div class="date-section">
    <div class="date-nav">
      <button class="date-btn" onclick="changeDate(-1)">◀</button>
      <input type="date" class="date-input" id="dateInput" onchange="onDateChange()">
      <button class="date-btn" onclick="changeDate(1)">▶</button>
    </div>
    <button class="today-btn" onclick="goToday()">回到今日</button>
    <div class="date-display" id="dateDisplay"></div>
  </div>

  <!-- Ganzhi Banner -->
  <div class="ganzhi-banner" id="ganzhiBanner"></div>

  <!-- Fortune Content -->
  <div id="fortuneContent"></div>

  <!-- Mingpan Info Strip -->
  <div class="mingpan-strip">
    <div class="mp-item"><div class="mp-label">命宮</div><div class="mp-val">寅</div></div>
    <div class="mp-item"><div class="mp-label">身宮</div><div class="mp-val">未</div></div>
    <div class="mp-item"><div class="mp-label">五行局</div><div class="mp-val">木三局</div></div>
    <div class="mp-item"><div class="mp-label">主星</div><div class="mp-val">紫微</div></div>
    <div class="mp-item"><div class="mp-label">大限</div><div class="mp-val">第四限</div></div>
    <div class="mp-item"><div class="mp-label">流年命宮</div><div class="mp-val">申</div></div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="footer-ornament">✦ ✦ ✦</div>
    <p>紫微斗數命盤｜戊辰年七月三十日亥時生｜木三局男命</p>
  </div>

  <!-- PWA 安裝提示條 -->
  <div class="pwa-bar" id="pwaBar">
    <div class="pwa-text"><strong>安裝到桌面</strong><br>像APP一樣快速開啟</div>
    <button class="pwa-install-btn" onclick="installPWA()">安裝</button>
    <button class="pwa-dismiss-btn" onclick="dismissPWA()">×</button>
  </div>

</div>

<script>
// ── STAR BACKGROUND ──
(function() {
  const container = document.getElementById('bgStars');
  for (let i = 0; i < 80; i++) {
    const el = document.createElement('div');
    el.className = 'star-dot';
    const size = Math.random() * 2 + 0.5;
    el.style.cssText = `
      width:${size}px; height:${size}px;
      left:${Math.random()*100}%;
      top:${Math.random()*100}%;
      --dur:${3+Math.random()*6}s;
      --delay:${Math.random()*8}s;
      --op:${0.1+Math.random()*0.4};
    `;
    container.appendChild(el);
  }
})();

// ── DATE SYSTEM ──
const STEMS = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const BRANCHES = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const WEEKDAYS = ['日','一','二','三','四','五','六'];
const LUNAR_MONTHS = ['正','二','三','四','五','六','七','八','九','十','冬','臘'];

// Ganzhi calculation (epoch: Jan 1, 1900 = 甲子 day index 0)
// Jan 1 1900 is 甲戌日 (stem=0, branch=10) → dayIndex = 10 mod 60
// Actually let's use a known reference: Jan 1 2000 = 甲戌 → stemIdx=0, branchIdx=10
// dayIndex from J2000: (daysSinceJ2000 + offset) mod 60
// J2000 = Jan 1 2000. 甲戌 = stem 0, branch 10 → cycle index = 10 (since 甲子=0, 甲戌= stem0+branch10= need LCM)
// Ganzhi cycle: stem repeats 10, branch repeats 12, LCM=60
// 甲子=0, 乙丑=1, ..., 甲戌= stem(甲=0) branch(戌=10) → position in 60 cycle = ?
// We know: cycle[i] = stem[i%10], branch[i%12]
// Find i where stem=0 AND branch=10: i%10=0 AND i%12=10 → i=10 works (10%10=0, 10%12=10) → yes! Jan 1 2000 = index 10

function getGanzhi(date) {
  const j2000 = new Date(2000, 0, 1);
  const diff = Math.floor((date - j2000) / 86400000);
  const dayIdx = ((diff + 10) % 60 + 60) % 60;
  const stem = STEMS[dayIdx % 10];
  const branch = BRANCHES[dayIdx % 12];
  return { stem, branch, dayIdx, stemIdx: dayIdx % 10, branchIdx: dayIdx % 12 };
}

function getYearGanzhi(date) {
  // Year ganzhi: 甲子 = 1984, cycle 60
  const year = date.getFullYear();
  // Check if before Feb 4 (approx lichun) to determine ganzhi year
  const lichun = new Date(year, 1, 4);
  const adjustedYear = date < lichun ? year - 1 : year;
  const idx = ((adjustedYear - 1984) % 60 + 60) % 60;
  return { stem: STEMS[idx % 10], branch: BRANCHES[idx % 12] };
}

function getMonthGanzhi(date) {
  // Month ganzhi: complex, use simplified calculation
  // Reference: Jan 2000 month = 丁丑 (stem=3, branch=1)
  const year = date.getFullYear();
  const month = date.getMonth();
  const totalMonths = (year - 2000) * 12 + month;
  const idx = ((totalMonths + 3) % 60 + 60) % 60; // 丁丑=3,1 → index 13? Let's compute: stem=3,branch=1 → i where i%10=3 and i%12=1 → i=13
  const adjusted = ((totalMonths + 13) % 60 + 60) % 60;
  return { stem: STEMS[adjusted % 10], branch: BRANCHES[adjusted % 12] };
}

function getLunarInfo(date) {
  // Simplified lunar date approximation
  const lunarMonthDays = [29, 30];
  // Use a simple offset: Jan 1 2026 ≈ 農曆十一月十二
  const ref = new Date(2026, 0, 1);
  const diff = Math.floor((date - ref) / 86400000);
  let lunarDay = ((12 + diff) % 30 + 1);
  let lunarMonthIdx = ((10 + Math.floor((12 + diff) / 30)) % 12 + 12) % 12;
  return `農曆${LUNAR_MONTHS[lunarMonthIdx]}月${lunarDay}日`;
}

// Element interactions for fortune scoring
const STEM_ELEMENT = { '甲':'木','乙':'木','丙':'火','丁':'火','戊':'土','己':'土','庚':'金','辛':'金','壬':'水','癸':'水' };
const BRANCH_ELEMENT = { '子':'水','丑':'土','寅':'木','卯':'木','辰':'土','巳':'火','午':'火','未':'土','申':'金','酉':'金','戌':'土','亥':'水' };

// Jerry's favorable: 木(命主), 火(生木), 水(生木木旺)
// Unfavorable: 金(剋木), 土(木剋土但多則耗)
const ELEM_SCORE = { '木':90, '火':80, '水':75, '土':60, '金':45 };

function calcDayScores(gz, date) {
  const dayElem = STEM_ELEMENT[gz.stem];
  const branchElem = BRANCH_ELEMENT[gz.branch];
  const palace = BRANCH_PALACE[gz.branch];

  // Base from elements
  let base = (ELEM_SCORE[dayElem] + ELEM_SCORE[branchElem]) / 2;

  // Palace resonance
  let palaceBonus = 0;
  if (palace?.special) palaceBonus = 15; // Ming palace
  if (palace?.liuyear) palaceBonus = 12; // Liuyear ming
  if (palace?.daxian) palaceBonus = 8;   // Daxian ming
  if (palace?.shen) palaceBonus = -5;    // Shen palace + lian忌

  //归禄 bonus (stem归禄 in its branch)
  const guilu = { '甲':'寅','乙':'卯','丙':'巳','丁':'午','戊':'巳','己':'午','庚':'申','辛':'酉','壬':'亥','癸':'子' };
  if (guilu[gz.stem] === gz.branch) palaceBonus += 10;

  // Month context (2026 bing-wu, 廉貞忌 active)
  const month = date.getMonth() + 1;
  let monthMod = 0;
  if ([10, 11].includes(month)) monthMod = -10; // 廉貞忌 peak
  if ([4, 6].includes(month)) monthMod = -5;
  if ([2, 5, 8, 12].includes(month)) monthMod = 8;

  const overall = Math.min(98, Math.max(30, Math.round(base + palaceBonus + monthMod)));

  // Individual area scores with variation
  const seed = gz.dayIdx;
  const career = Math.min(98, Math.max(25, overall + ((seed * 7) % 20) - 10));
  const money = Math.min(98, Math.max(25, overall + ((seed * 11) % 20) - 10));
  const love = Math.min(98, Math.max(25, overall + ((seed * 13) % 20) - 10));
  const health = Math.min(98, Math.max(25, overall + ((seed * 17) % 20) - 10));

  return { overall, career, money, love, health, palace, dayElem, branchElem };
}

// ── RENDER ──
function scoreClass(v) {
  if (v >= 75) return 'high';
  if (v >= 55) return 'mid';
  return 'low';
}

function starHTML(score) {
  const filled = Math.round(score / 20);
  return Array.from({length:5}, (_,i) =>
    `<div class="s ${i < filled ? 'on' : ''}"></div>`
  ).join('');
}

function scoreLabel(v) {
  if (v >= 85) return '極佳';
  if (v >= 75) return '良好';
  if (v >= 60) return '平穩';
  if (v >= 45) return '偏弱';
  return '謹慎';
}

  `;
}

// ── DATE CONTROLS ──
let currentDate = new Date();
currentDate.setHours(0,0,0,0);

function formatDateInput(d) {
  return d.toISOString().split('T')[0];
}

function goToday() {
  currentDate = new Date();
  currentDate.setHours(0,0,0,0);
  document.getElementById('dateInput').value = formatDateInput(currentDate);
  renderFortune(currentDate);
}

function changeDate(days) {
  currentDate.setDate(currentDate.getDate() + days);
  document.getElementById('dateInput').value = formatDateInput(currentDate);
  renderFortune(currentDate);
}

function onDateChange() {
  const val = document.getElementById('dateInput').value;
  if (val) {
    currentDate = new Date(val + 'T00:00:00');
    renderFortune(currentDate);
  }
}

// ── INIT ──
document.getElementById('dateInput').value = formatDateInput(currentDate);
renderFortune(currentDate);

// ══════════════════════════════
// PWA：Service Worker 註冊
// ══════════════════════════════
if ('serviceWorker' in navigator) {
  window.addEventListener('load', async () => {
    try {
      const reg = await navigator.serviceWorker.register('./sw.js');
      console.log('✅ SW 註冊成功', reg.scope);
      window._swReg = reg;
      // 檢查通知權限狀態
      updateNotifyBtn();
      // 嘗試設定 Periodic Sync
      if ('periodicSync' in reg) {
        try {
          await reg.periodicSync.register('daily-fortune-push', { minInterval: 24 * 60 * 60 * 1000 });
        } catch(e) { console.log('Periodic Sync 不支援，改用本地排程'); }
      }
    } catch(e) {
      console.log('SW 註冊失敗', e);
    }
  });
}

// ══════════════════════════════
// PWA：安裝提示
// ══════════════════════════════
let deferredPrompt = null;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  // 延遲2秒後顯示安裝條
  setTimeout(() => {
    const bar = document.getElementById('pwaBar');
    if (bar && !localStorage.getItem('pwa-dismissed')) {
      bar.classList.add('show');
    }
  }, 2000);
});

window.addEventListener('appinstalled', () => {
  deferredPrompt = null;
  document.getElementById('pwaBar').classList.remove('show');
  console.log('✅ PWA 已安裝');
});

async function installPWA() {
  if (!deferredPrompt) {
    // iOS 手動提示
    alert('iOS 安裝步驟：\n1. 點擊底部的「分享」按鈕（方框加箭頭）\n2. 選擇「加入主畫面」\n3. 點擊「新增」');
    return;
  }
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  deferredPrompt = null;
  document.getElementById('pwaBar').classList.remove('show');
}

function dismissPWA() {
  document.getElementById('pwaBar').classList.remove('show');
  localStorage.setItem('pwa-dismissed', '1');
}

// ══════════════════════════════
// 推送通知
// ══════════════════════════════
function updateNotifyBtn() {
  const btn = document.getElementById('notifyBtn');
  const label = document.getElementById('notifyLabel');
  const icon = document.getElementById('notifyIcon');
  if (!btn) return;

  if (!('Notification' in window)) {
    btn.style.display = 'none';
    return;
  }

  if (Notification.permission === 'granted') {
    btn.classList.add('enabled');
    icon.textContent = '✅';
    label.textContent = '每日推送已開啟（早上8點）';
  } else if (Notification.permission === 'denied') {
    btn.classList.remove('enabled');
    icon.textContent = '🔕';
    label.textContent = '推送已被封鎖（請至設定開啟）';
  } else {
    btn.classList.remove('enabled');
    icon.textContent = '🔔';
    label.textContent = '開啟每日推送提醒';
  }
}

async function requestNotify() {
  if (!('Notification' in window)) {
    alert('你的瀏覽器不支援推送通知，建議安裝到桌面後再試。');
    return;
  }

  if (Notification.permission === 'granted') {
    // 已授權，發一則測試通知
    const reg = window._swReg || await navigator.serviceWorker.ready;
    reg.showNotification('🌟 日運星盤', {
      body: '推送通知已開啟！每天早上8點會提醒你查看今日運勢。',
      icon: './icons/icon-192.png',
      badge: './icons/icon-72.png',
      tag: 'test'
    });
    return;
  }

  const permission = await Notification.requestPermission();
  updateNotifyBtn();

  if (permission === 'granted') {
    // 設定本地鬧鐘排程（備援方案）
    scheduleLocalNotification();
    const reg = window._swReg || await navigator.serviceWorker.ready;
    reg.showNotification('🌟 每日運勢提醒已開啟', {
      body: '每天早上8點，日運星盤會提醒你查看今日運勢。',
      icon: './icons/icon-192.png',
      badge: './icons/icon-72.png',
      tag: 'welcome'
    });
  }
}

// 本地排程：利用 localStorage 記錄，下次開APP時檢查是否要推送
function scheduleLocalNotification() {
  const tomorrow8am = new Date();
  tomorrow8am.setDate(tomorrow8am.getDate() + 1);
  tomorrow8am.setHours(8, 0, 0, 0);
  localStorage.setItem('next-notify', tomorrow8am.getTime().toString());
}

// 每次開APP時，檢查是否應該顯示通知
async function checkLocalSchedule() {
  if (Notification.permission !== 'granted') return;
  const nextTime = parseInt(localStorage.getItem('next-notify') || '0');
  if (!nextTime) return;
  const now = Date.now();
  if (now >= nextTime) {
    const today = new Date();
    const reg = window._swReg || await navigator.serviceWorker.ready;
    reg.showNotification('🌟 今日運勢', {
      body: `${today.getMonth()+1}月${today.getDate()}日 運勢已更新，點擊查看今日星盤。`,
      icon: './icons/icon-192.png',
      badge: './icons/icon-72.png',
      tag: 'daily-fortune',
      data: { url: './index.html' }
    });
    scheduleLocalNotification(); // 排下一天
  }
}

// 開APP時執行
window.addEventListener('load', () => {
  setTimeout(checkLocalSchedule, 1500);
});
</script>
